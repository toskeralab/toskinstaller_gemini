name: Criar Estrutura Inicial

on:
  workflow_dispatch:

jobs:
  scaffold:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Criar Diretórios e Arquivos Vazios
        run: |
          mkdir -p .github/workflows assets/themes src/core src/gui src/runtime_stub src/utils
          
          touch .github/workflows/build_release.yml
          touch assets/themes/toskera_cyber.json
          touch assets/default_banner.png
          touch src/__init__.py
          touch src/core/__init__.py
          touch src/core/analyzer.py
          touch src/core/compiler_wrapper.py
          touch src/core/config_model.py
          touch src/core/packager.py
          touch src/gui/__init__.py
          touch src/gui/app.py
          touch src/runtime_stub/__init__.py
          touch src/runtime_stub/setup_runner.py
          touch src/utils/__init__.py
          touch src/utils/i18n.py
          touch src/utils/sys_check.py
          touch src/utils/signer.py
          touch build_portable.py
          touch main.py
          touch requirements.txt
          touch README.md
          touch LICENSE

      - name: Commit e Push Nativo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: cria estrutura de diretórios e arquivos vazios" || exit 0
          git push
